app-id: com.finnfreitag.thulium
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: thulium

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --socket=cups
  - --filesystem=host
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd

modules:
  - name: thulium
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - build
          - CMakeFiles
          - .flatpak-builder
          - build-flatpak
          - repo
